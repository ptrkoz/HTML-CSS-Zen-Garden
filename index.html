<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista zadań</title>
</head>
<body>
  <h1>Lista zadań</h1>
  <div class="panel">
    <div class="search">
      <input id="search" placeholder="Wyszukaj" type="search" autocomplete="off" />
    </div>

    <ul id="list" aria-live="polite"></ul>
    <div id="empty" class="empty" style="display:none">Brak zadań</div>

    <div class="bottom">
      <input id="new-text" type="text" placeholder="Nowe zadanie" />
      <input id="new-due" type="datetime-local" />
      <button id="add">Dodaj</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
